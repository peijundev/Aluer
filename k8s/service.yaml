# Aluer ServerGuard — Service
# 对外暴露 Web 控制台（8080），同时承载 Agent WebSocket 端点 /agent。
# 用法：kubectl apply -f k8s/service.yaml
#
# type 说明：
#   - LoadBalancer：云环境（EKS/GKE/AKS）对外暴露，获取公网 IP
#   - NodePort   ：自建集群，通过节点 IP + 端口访问
#   - ClusterIP  ：仅集群内部（Agent 插件在集群内连接引擎时使用）
apiVersion: v1
kind: Service
metadata:
  name: serverguard
  namespace: aluer
  labels:
    app: serverguard
spec:
  type: LoadBalancer
  selector:
    app: serverguard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
