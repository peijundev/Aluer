# Aluer ServerGuard — 敏感配置（Secret）
# 使用 base64 编码，生产环境建议改用 SealedSecret / External Secrets 等方案。
# 生成 base64：echo -n 'your-value' | base64
# 用法：kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: serverguard-secret
  namespace: aluer
type: Opaque
data:
  # Minecraft RCON 密码（External 模式必填，与 Minecraft 服务端 RCON 一致）
  RCON_PASSWORD: "Y2hhbmdlLW1lLXBsZWFzZQ=="          # base64 of "change-me-please"

  # DeepSeek AI 密钥（可选，留空则 AI 自动禁用）
  DEEPSEEK_API_KEY: ""                                # base64 of "sk-xxx"

  # 邮件告警（可选）
  ALUER_ALERT_SMTP_USERNAME: ""                       # base64 of "your@example.com"
  ALUER_ALERT_SMTP_PASSWORD: ""                       # base64 of "smtp-password"
  ALUER_ALERT_EMAIL_PRIMARY: ""                       # base64 of "admin@example.com"
