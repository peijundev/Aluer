name: Release

# 发布自动化：推送 v* 标签时，构建前端 + 编译 + 跑全量测试 + 打包，
# 并将 serverguard.jar 作为附件发布到 GitHub Release。
# 注意：推送标签（包括 gh release create 在内）都会触发本工作流，
# 因此不要再手动用 gh release create 发布同一标签，避免重复创建与附件冲突。
on:
  push:
    tags:
      - 'v*'

# 需要写权限来创建 Release 并上传附件
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      # 打包并跑全量测试，确保发布的 jar 来自通过测试的代码
      - name: 打包（含全量测试）
        run: ./apache-maven-3.9.6/bin/mvn clean package

      # 自动创建 GitHub Release 并附上可执行 jar
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/serverguard.jar
          generate_release_notes: true
