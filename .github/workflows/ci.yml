name: CI

# 持续集成：每次推送到 main 或发起 PR 时，构建前端 + 编译 + 跑全量测试
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: 构建与全量测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Java 21 与项目要求一致（Spring Boot 3.2.0 + PaperMC 1.21.1）
      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 前端为 Vite + React，构建产物输出到 src/main/resources/static，
      # 随后被 Maven 打包进 serverguard.jar，因此必须先生成
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      # 使用项目内置的 Maven 3.9.6，保证与本地开发环境版本一致
      - name: 全量测试
        run: ./apache-maven-3.9.6/bin/mvn clean test

      # 测试报告产物，便于事后查看失败详情
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
